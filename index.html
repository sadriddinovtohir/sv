    <script>
      // gtag.js costs ~0.5s of main-thread time, so it is fetched on the
      // visitor's first interaction (or after 6s at the latest) instead of
      // during load, where it would block the page from responding.
      (function () {
        var GA_ID = '%VITE_GA_ID%';
        if (!GA_ID || GA_ID.indexOf('%') === 0 || GA_ID === 'G-XXXXXXX') return;
        window.dataLayer = window.dataLayer || [];
        window.gtag = function () { window.dataLayer.push(arguments); };
        window.gtag('js', new Date());
        window.gtag('config', GA_ID);
        var events = ['pointerdown', 'keydown', 'scroll', 'touchstart'];
        var loaded = false;
        function load() {
          if (loaded) return;
          loaded = true;
          events.forEach(function (e) { window.removeEventListener(e, load); });
          var s = document.createElement('script');
          s.async = true;
          s.src = 'https://www.googletagmanager.com/gtag/js?id=' + GA_ID;
          document.head.appendChild(s);
        }
        events.forEach(function (e) { window.addEventListener(e, load, { once: true, passive: true }); });
        setTimeout(load, 6000);
      })();
    </script>
