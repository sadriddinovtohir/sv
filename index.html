<!doctype html>

    <meta charset="UTF-8" />

    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="theme-color" content="#05080f" />
    <script>
      // Resolve the theme before anything paints (mirrors src/lib/theme.js),
      // so a light-theme visitor never sees a dark flash while JS loads.
      (function () {
        try {
          var t = localStorage.getItem('theme');
          if (t !== 'light' && t !== 'dark')
            t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          document.documentElement.dataset.theme = t;
          if (t === 'light') document.querySelector('meta[name="theme-color"]').setAttribute('content', '#f4f6fb');
        } catch (e) {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
    <style>
      /* Boot loader — painted before any JS runs; React replaces #root's
         contents on its first render, which removes it. */
      .boot{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;background:#05080f;font-family:system-ui,sans-serif}
      .boot-ring{position:relative;width:64px;height:64px}
      .boot-ring i{position:absolute;inset:0;border-radius:50%;border:3px solid transparent;animation:boot-spin 1.1s cubic-bezier(.5,0,.5,1) infinite}
      .boot-ring i:nth-child(1){border-top-color:#3d6bff}
      .boot-ring i:nth-child(2){inset:9px;border-top-color:#2ee6a6;animation-duration:1.5s;animation-direction:reverse}
      .boot-ring i:nth-child(3){inset:18px;border-top-color:#ffb547;animation-duration:.9s}
      .boot-text{font:700 14px/1 ui-monospace,monospace;letter-spacing:.2em;color:#ffffff99}
      .boot-text b{color:#2ee6a6;font-weight:700}
      .boot-dots span{animation:boot-blink 1.2s infinite both}
      .boot-dots span:nth-child(2){animation-delay:.2s}
      .boot-dots span:nth-child(3){animation-delay:.4s}
      @keyframes boot-spin{to{transform:rotate(360deg)}}
      @keyframes boot-blink{0%,80%,100%{opacity:0}40%{opacity:1}}
      @media (prefers-reduced-motion:reduce){.boot-ring i,.boot-dots span{animation:none}}
      html,body{background:#05080f}
      html[data-theme=light],html[data-theme=light] body,html[data-theme=light] .boot{background:#f4f6fb}
      html[data-theme=light] .boot-text{color:#0b122299}
      html[data-theme=light] .boot-text b{color:#059669}
    </style>
    <meta name="color-scheme" content="dark light" />

    <script>
      // gtag.js costs ~0.5s of main-thread time, so it is fetched on the
      // visitor's first interaction (or after 6s at the latest) instead of
      // during load, where it would block the page from responding.
      (function () {
        var GA_ID = '%VITE_GA_ID%';
        if (!GA_ID || GA_ID.indexOf('%') === 0 || GA_ID === 'G-XXXXXXX') return;
        window.dataLayer = window.dataLayer || [];
        window.gtag = function () { window.dataLayer.push(arguments); };
        window.gtag('js', new Date());
        window.gtag('config', GA_ID);
        var events = ['pointerdown', 'keydown', 'scroll', 'touchstart'];
        var loaded = false;
        function load() {
          if (loaded) return;
          loaded = true;
          events.forEach(function (e) { window.removeEventListener(e, load); });
          var s = document.createElement('script');
          s.async = true;
          s.src = 'https://www.googletagmanager.com/gtag/js?id=' + GA_ID;
          document.head.appendChild(s);
        }
        events.forEach(function (e) { window.addEventListener(e, load, { once: true, passive: true }); });
        setTimeout(load, 6000);
      })();
    </script>
  </body>
